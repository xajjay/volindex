# Publishes the site to GitHub Pages whenever main changes, including after each automatic data update.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package site (skip tools and caches)
        run: |
          mkdir _site
          cp -r index.html assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
