# Updates The Vol Index automatically. Runs every morning; tools/auto_schedule.py decides
# what actually needs refreshing (day after games, poll days, Thursday lines, Monday full refresh).
# Run it by hand any time: Actions tab -> "Update data" -> Run workflow.
name: Update data

on:
  schedule:
    - cron: "15 11 * * *"     # 7:15 AM Eastern (6:15 AM in winter)
  workflow_dispatch:
    inputs:
      force:
        description: "Update every sport regardless of the day"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scheduled updates
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python tools/update_data.py --auto ${{ inputs.force && '--force' || '' }}
      - name: Save changes
        run: |
          git config user.name "vol-index-bot"
          git config user.email "vol-index-bot@users.noreply.github.com"
          git add data tools/cache
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Data update $(date -u +%Y-%m-%d)" && git push; fi
