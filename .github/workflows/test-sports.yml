# Temporary: runs the sports updater on the dev-sports branch and commits the output there for review.
name: Test sports updater
on:
  push:
    branches: [dev-sports]
    paths: ["tools/update_sports.py", ".github/workflows/test-sports.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/update_sports.py 2>&1 | tee tools/sports-run.log
      - run: |
          git config user.name "vol-index-bot"; git config user.email "vol-index-bot@users.noreply.github.com"
          git add data tools/cache tools/sports-run.log
          git commit -m "test run output" || true
          git push
